name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, english ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: |
          cd web-demo
          bun install
      
      - name: Build and prepare site
        run: |
          cd web-demo
          # Remove old app files to ensure clean deployment
          rm -f public/src/app-bundle.js public/src/app-bundle.js.map public/src/app.js public/src/app.js.map
          # Use swipe-onnx.html as the main index.html
          cp public/swipe-onnx.html public/index.html
          echo "Using swipe-onnx.html as main site"
          ls -la public/
      
      - name: Prepare deployment models
        run: |
          # Remove any existing models directory (might be symlink or have old files)
          rm -rf web-demo/public/models
          
          # Create fresh models directory
          mkdir -p web-demo/public/models
          
          # Copy quantized model files (smaller, faster)
          cp deployment_package/swipe_model_character_quant.onnx web-demo/public/models/
          cp deployment_package/swipe_decoder_character_quant.onnx web-demo/public/models/
          cp deployment_package/tokenizer_config.json web-demo/public/models/
          
          # Also copy full models as fallback
          cp deployment_package/swipe_model_character.onnx web-demo/public/models/
          cp deployment_package/swipe_decoder_character.onnx web-demo/public/models/
          
          echo "Models copied successfully"
          ls -la web-demo/public/models/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-demo/public'
      
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4