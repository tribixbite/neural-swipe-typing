<!DOCTYPE html>
<html>
<head>
    <title>Vocabulary Loading Test</title>
</head>
<body>
    <h1>Vocabulary Loading Test</h1>
    <div id="status">Testing vocabulary loading...</div>
    <pre id="output"></pre>
    
    <script>
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        
        async function testVocabularyLoading() {
            try {
                output.textContent += 'Starting vocabulary load test...\n';
                
                const vocabUrl = 'models/english_vocab.txt';
                output.textContent += `Fetching from: ${vocabUrl}\n`;
                
                const response = await fetch(vocabUrl);
                output.textContent += `Response status: ${response.status} ${response.statusText}\n`;
                output.textContent += `Content-Type: ${response.headers.get('Content-Type')}\n`;
                output.textContent += `Content-Length: ${response.headers.get('Content-Length')}\n`;
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                output.textContent += `Text loaded, length: ${text.length}\n`;
                
                const lines = text.split('\n');
                output.textContent += `Total lines: ${lines.length}\n`;
                
                // Show first 10 words
                output.textContent += '\nFirst 10 words:\n';
                for (let i = 0; i < 10 && i < lines.length; i++) {
                    output.textContent += `  ${i + 1}: ${lines[i].trim()}\n`;
                }
                
                status.textContent = 'Vocabulary loaded successfully!';
                status.style.color = 'green';
                
            } catch (error) {
                output.textContent += `\nError: ${error.message}\n`;
                output.textContent += `Stack: ${error.stack}\n`;
                status.textContent = 'Failed to load vocabulary!';
                status.style.color = 'red';
            }
        }
        
        // Run test on page load
        testVocabularyLoading();
    </script>
</body>
</html>
