<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Swipe Typing - ONNX Demo</title>
    
    <!-- Modern fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Load ONNX Runtime directly -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen overflow-hidden flex flex-col">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
        <div class="max-w-6xl mx-auto px-2 sm:px-4 py-2 sm:py-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-indigo-600 dark:text-indigo-400">Neural Swipe Typing</h1>
                    <p class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 hidden sm:block">ONNX Model • 70.1% Accuracy</p>
                </div>
                <button id="theme-toggle" class="p-1.5 sm:p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <svg class="w-6 h-6 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                    </svg>
                    <svg class="w-6 h-6 dark:hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
                <p class="mt-4 text-lg font-semibold">Loading ONNX Models...</p>
                <p id="loading-progress" class="text-sm text-gray-600 dark:text-gray-400 mt-2">Initializing Runtime</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 flex flex-col max-w-6xl w-full mx-auto px-2 sm:px-4 py-2 sm:py-4 gap-2 sm:gap-3 min-h-0">
            <!-- Status and Swipe Path Row -->
            <div class="flex gap-2 flex-shrink-0">
                <!-- Status Bar -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-2 sm:p-3 flex items-center justify-between flex-1">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs sm:text-sm font-medium text-gray-600 dark:text-gray-400">Status:</span>
                        <span id="status" class="text-xs sm:text-sm font-semibold text-green-600 dark:text-green-400">Ready</span>
                    </div>
                    <div class="flex items-center space-x-1 sm:space-x-2">
                        <button id="clear-btn" class="px-2 py-1 sm:px-3 sm:py-1.5 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 active:scale-95">
                            Clear
                        </button>
                        <button id="debug-btn" class="px-2 py-1 sm:px-3 sm:py-1.5 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 active:scale-95">
                            Debug: OFF
                        </button>
                    </div>
                </div>
            </div>

            <!-- Swipe Characters Display -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-2 sm:p-3 flex-shrink-0">
                <div id="swipe-chars" class="font-mono text-sm sm:text-lg tracking-wider text-indigo-600 dark:text-indigo-400 text-center min-h-[24px]">
                    <span class="text-gray-400 dark:text-gray-600 text-xs sm:text-sm">Touch the keyboard to start swiping...</span>
                </div>
            </div>

            <!-- Keyboard Container - Flexible but contained -->
            <div class="flex-1 bg-white dark:bg-gray-800 rounded-lg shadow-sm p-2 sm:p-4 flex items-center justify-center min-h-0 overflow-hidden">
                <div class="w-full h-full max-w-full sm:max-w-2xl flex items-center justify-center">
                    <div class="relative w-full" style="max-height: 100%;">
                        <canvas 
                            id="keyboard-canvas" 
                            width="360" 
                            height="215"
                            class="rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900"
                            style="width: 100%; height: auto; display: block;"
                            role="application" 
                            aria-label="Swipe keyboard - draw gestures to input text"
                        ></canvas>
                    </div>
                </div>
            </div>

            <!-- Predictions -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-2 sm:p-3 flex-shrink-0 max-h-[100px] sm:max-h-[120px] overflow-hidden">
                <div id="predictions" class="flex flex-wrap gap-1 sm:gap-2 items-center justify-center overflow-y-auto max-h-[76px] sm:max-h-[90px]">
                    <p class="text-gray-500 dark:text-gray-400 text-center w-full text-xs sm:text-sm">
                        Swipe on the keyboard to see predictions
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- App Scripts -->
    <script type="module">
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.className = savedTheme;
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.className;
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
        });
        
        // Wait for ONNX Runtime to be available
        async function initApp() {
            try {
                // Check if ort is available
                if (typeof ort === 'undefined') {
                    throw new Error('ONNX Runtime not loaded');
                }
                
                // Configure ONNX Runtime
                ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
                
                // Load the app
                const module = await import('./src/app-bundle.js');
                console.log('App loaded successfully');
            } catch (error) {
                console.error('Failed to initialize app:', error);
                document.getElementById('loading-progress').textContent = 'Error: ' + error.message;
            }
        }
        
        // Initialize when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
