<!DOCTYPE html>
<html>
<head>
    <title>Test Encoder</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
    <script>
        // Set ONNX Runtime WebAssembly paths
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
    </script>
</head>
<body>
    <h1>Testing Encoder Only</h1>
    <div id="status">Loading...</div>
    <pre id="output"></pre>
    
    <script>
        async function testEncoder() {
            const statusEl = document.getElementById('status');
            const outputEl = document.getElementById('output');
            
            try {
                // Load encoder
                statusEl.textContent = 'Loading encoder...';
                const session = await ort.InferenceSession.create('/models/swipe_model_character.onnx', {
                    executionProviders: ['wasm'],
                    graphOptimizationLevel: 'all'
                });
                
                outputEl.textContent += 'Encoder loaded successfully\n';
                outputEl.textContent += 'Input names: ' + session.inputNames.join(', ') + '\n';
                outputEl.textContent += 'Output names: ' + session.outputNames.join(', ') + '\n\n';
                
                // Create test inputs
                const batchSize = 1;
                const sequenceLength = 10;
                
                // trajectory_features: [batch, sequence, 6] - FLOAT
                const features = new Float32Array(batchSize * sequenceLength * 6);
                for (let i = 0; i < features.length; i++) {
                    features[i] = Math.random();
                }
                
                // nearest_keys: [batch, sequence] - INT64
                const nearestKeys = new BigInt64Array(batchSize * sequenceLength);
                for (let i = 0; i < nearestKeys.length; i++) {
                    nearestKeys[i] = BigInt(Math.floor(Math.random() * 26) + 4); // Random letter indices
                }
                
                // src_mask: [batch, sequence] - BOOL (as Uint8Array)
                const srcMask = new Uint8Array(batchSize * sequenceLength);
                // Fill with 0s (false)
                
                outputEl.textContent += 'Creating tensors...\n';
                
                const inputs = {
                    trajectory_features: new ort.Tensor('float32', features, [batchSize, sequenceLength, 6]),
                    nearest_keys: new ort.Tensor('int64', nearestKeys, [batchSize, sequenceLength]),
                    src_mask: new ort.Tensor('bool', srcMask, [batchSize, sequenceLength])
                };
                
                outputEl.textContent += 'Input tensors created:\n';
                outputEl.textContent += '  trajectory_features: ' + inputs.trajectory_features.dims + '\n';
                outputEl.textContent += '  nearest_keys: ' + inputs.nearest_keys.dims + '\n';
                outputEl.textContent += '  src_mask: ' + inputs.src_mask.dims + '\n\n';
                
                outputEl.textContent += 'Running inference...\n';
                const outputs = await session.run(inputs);
                
                outputEl.textContent += 'SUCCESS! Encoder output shape: ' + outputs.encoder_output.dims + '\n';
                statusEl.textContent = 'Success!';
                statusEl.style.color = 'green';
                
            } catch (error) {
                outputEl.textContent += '\nERROR: ' + error + '\n';
                outputEl.textContent += 'Error message: ' + error.message + '\n';
                outputEl.textContent += 'Error stack: ' + error.stack + '\n';
                statusEl.textContent = 'Failed';
                statusEl.style.color = 'red';
            }
        }
        
        testEncoder();
    </script>
</body>
</html>
